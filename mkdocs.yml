site_name: Wiki
site_description: A lean personal knowledge base — synthesis and curated sources, not encyclopedia summaries.
site_author: Ronald Liu
site_url: https://tato4936.github.io/wiki/
strict: true     # fail the build on a broken internal link or a nav entry pointing nowhere

theme:
  name: material
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  font: { text: Inter, code: JetBrains Mono }
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.footer        # Previous / Next links at the bottom of each page
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tooltips

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - footnotes
  - attr_list
  - md_in_html
  - tables
  - def_list
  - toc: { permalink: true }

